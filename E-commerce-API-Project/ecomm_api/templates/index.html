<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atbara Trade - P2P Trading Platform</title>
    <link rel="stylesheet" href="/static/frontend/style.css">
</head>
<body>
    <!-- Animated blue-sky backdrop (purely decorative) -->
    <div class="sky" aria-hidden="true">
        <div class="sun"></div>
        <span class="glow glow-a"></span>
        <span class="glow glow-b"></span>
        <span class="cloud cloud-1"></span>
        <span class="cloud cloud-2"></span>
        <span class="cloud cloud-3"></span>
        <span class="cloud cloud-4"></span>
    </div>

    <div class="page-wrap">
        <header>
            <div class="brand-panel">
                <h1 class="site-title">
                    <span class="brand">Atbara</span><span class="brand-accent"> Trade</span>
                </h1>
                <!-- A subtitle for the site, separate from user controls -->
                <p class="subtitle">Nice to See you onboard!, Hope you're having a Great Day!</p>
            </div>

            <!-- A dedicated container for user-specific actions -->
            <div id="user-info" class="hidden">
                <span id="welcome-message">Welcome!</span>
                <button id="show-profile-btn" class="profile-btn">My Profile</button>
                <button id="logout-button">Logout</button>
            </div>
        </header>

        <main>
            <!-- AUTHENTICATION (Login/Register) - This section is shown when logged out -->
            <section id="auth-section">
                <div class="form-container">
                    <h2>Create your account</h2>
                    <form id="register-form">
                        <label for="register-username" class="sr-only">Username</label>
                        <input type="text" id="register-username" placeholder="Username" required>

                        <label for="register-display-name" class="sr-only">Public Display Name</label>
                        <input type="text" id="register-display-name" placeholder="Your Public Display Name" required>

                        <label for="register-contact-info" class="sr-only">Public Contact Method</label>
                        <input type="text" id="register-contact-info" placeholder="Public Contact (e.g., social handle)" required>

                        <label for="register-email" class="sr-only">Email</label>
                        <input type="email" id="register-email" placeholder="Email" required>

                        <label for="register-password" class="sr-only">Password</label>
                        <input type="password" id="register-password" placeholder="Password" required>

                        <button type="submit">Register</button>
                    </form>
                </div>
                <div class="form-container">
                    <h2>Welcome back</h2>
                    <form id="login-form">
                        <label for="login-username" class="sr-only">Username</label>
                        <input type="text" id="login-username" placeholder="Username" required>

                        <label for="login-password" class="sr-only">Password</label>
                        <input type="password" id="login-password" placeholder="Password" required>

                        <button type="submit">Login</button>
                    </form>
                </div>
            </section>

            <!-- DASHBOARD (Main View) - Visible only when logged in -->
            <section id="dashboard-section" class="hidden">
                <div class="page-nav">
                    <button id="show-seller-form-btn" class="nav-btn sell">I'm a Seller</button>
                    <button id="show-buyer-form-btn" class="nav-btn buy">I Couldn't Find What I Want</button>
                </div>
                <div class="filters-container">
                    <input type="search" id="search-input" placeholder="Search items for sale...">
                    <!-- We can add a category filter dropdown here later -->
                </div>
                <div class="lists-container">
                    <div class="list">
                        <h2>Items for Sale</h2>
                        <div id="sale-list" class="item-grid"></div>
                    </div>
                    <div class="list">
                        <h2>Looking to Buy</h2>
                        <div id="request-list" class="item-grid"></div>
                    </div>
                </div>
            </section>

            <!-- SELLER FORM PAGE - Hidden by default -->
            <section id="seller-form-section" class="hidden">
                <button class="back-btn" data-target="dashboard-section">&larr; Back to Dashboard</button>
                <div class="form-container solo">
                    <h2>Create a New Sale Listing</h2>
                    <form id="product-form">
                        <input type="text" id="product-name" placeholder="Listing Title" required>
                        <textarea id="product-description" placeholder="Description" required></textarea>
                        <input type="text" id="product-category" placeholder="Category Name" required>
                        <input type="number" id="product-price" placeholder="Price" step="0.01" required>
                        <input type="number" id="product-stock" placeholder="Quantity Available" required>
                        <button type="submit">Post My Listing</button>
                    </form>
                </div>
            </section>

            <!-- BUYER FORM PAGE - Hidden by default -->
            <section id="buyer-form-section" class="hidden">
                <button class="back-btn" data-target="dashboard-section">&larr; Back to Dashboard</button>
                <div class="form-container solo">
                    <h2>Create a 'Want-to-Buy' Request</h2>
                    <form id="request-form">
                        <input type="text" id="request-product-name" placeholder="Product Name I'm Looking For" required>
                        <textarea id="request-description" placeholder="Description of what I want" required></textarea>
                        <input type="number" id="request-target-price" placeholder="Target Price I'm Willing to Pay" step="0.01" required>
                        <button type="submit">Post My Request</button>
                    </form>
                </div>
            </section>

            <!-- MY PROFILE PAGE - Hidden by default -->
            <section id="profile-section" class="hidden">
                <button class="back-btn" data-target="dashboard-section">&larr; Back to Dashboard</button>
                <div class="form-container solo">
                    <h2>My Public Profile</h2>
                    <p>This information will be shown on your listings and requests.</p>
                    <form id="profile-form">
                        <label for="profile-display-name">Public Display Name</label>
                        <input type="text" id="profile-display-name" required>

                        <label for="profile-contact-info">Public Contact Method</label>
                        <input type="text" id="profile-contact-info" required>

                        <button type="submit">Update Profile</button>
                    </form>
                </div>
            </section>

        </main>

        <!-- Modal for "Buy This" confirmation can be added here later -->
    </div>

    <script src="/static/frontend/app.js"></script>
</body>
</html>
